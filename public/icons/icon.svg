<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#060A14"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2CAF93"/>
      <stop offset="100%" stop-color="#198B74"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#5BCBA5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5BCBA5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- T mark em jade -->
  <g transform="translate(256 256)">
    <rect x="-120" y="-120" width="240" height="64" rx="32" fill="url(#jade)"/>
    <rect x="-32" y="-120" width="64" height="240" rx="32" fill="url(#jade)"/>
  </g>
  <!-- spark accent -->
  <circle cx="380" cy="132" r="16" fill="#5BCBA5"/>
</svg>
